    <script>
      document.addEventListener("DOMContentLoaded", function() {
            var music = document.getElementById("audio");
            var video = document.getElementById("polak");
            const sceneEl = document.querySelector('a-scene');
            let arSystem;
            sceneEl.addEventListener('loaded', function () {
                arSystem = sceneEl.systems["mindar-image-system"];
            });
            const exampleTarget = document.querySelector('#affiche');
            // detect target found
            exampleTarget.addEventListener("targetFound", event => {
                if (music.paused) {
                    music.play();
                }
                video.play();
                console.log("target found");
            });
            // detect target lost
            exampleTarget.addEventListener("targetLost", event => {
                if (!music.paused) {
                    music.pause();
                }
                video.pause();
                console.log("target found");
            });
      });
    </script>
</head>

<body>
    <audio src="musique/porte_dorléans.mp3" style="display: none;" id="audio"></audio>
   
    <a-scene
        mindar-image="imageTargetSrc: images/tortue.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img id="card" src="images/tortue.jpg" />
            <video id="polak" src="images/plkaka.mp4" preload="auto" loop="true" muted="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
           
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" id="affiche">
            <a-plane id="plan" class="clickable" src="#polak" position="0 0 0" width="0.707" height="1" scale="2 2 2" rotation="0 0 0"></a-plane>
            <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="1 1 1" src="#gltf-asset" />
        </a-entity>

        <a-camera cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable" position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>

</html>
