<!doctype HTML>
<html>
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('play-on-scan',{
            init: function () {
                var el = this.el;
                var music = document.getElementById("audio");
                el.sceneEl.addEventListener('markerFound', function () {
                        if (music.paused) {
                            music.play();
                        }
                });
                el.sceneEl.addEventListener('markerLost', function () {
                        if (!music.paused) {
                            music.pause();
                        }
                });
            }
        });
    </script>
</head>
<body style='margin : 0px; overflow: hidden;'>
    <audio src="musique/porte_dorléans.mp3" style="display: none;" id="audio"></audio>

    <a-scene
        mindar-image="imageTargetSrc: images/monimage.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img id="card" src="images/monimage.jpg" />
            <a-asset-item id="card" src="images/monalisa.jpg"></a-asset-item>
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane id="plan" class="clickable" src="#card" position="0 0 0" rotation="0 0 0" clickhandler></a-plane>
            <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="1 1 1" src="#gltf-asset" />
        </a-entity>

        <a-camera cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable" position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>

</html>
